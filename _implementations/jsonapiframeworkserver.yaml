name: JsonApiFramework.Server
category: Server Libraries
language: .NET
repo: https://github.com/scott-mcdonald/JsonApiFramework
purl: ''
description: >-
  is a portable .NET Standard/Core server-side framework where developers define
  the domain model of the resources of a hypermedia API server either through
  configuration and/or conventions called a service model. With a service model
  developers can use a document context that represents a session with a
  JSON:API compound document for reading or writing of various JSON:API
  abstractions such as resources
